name: 🚀 Release packages

on:
    release:
        types: [ published ]

env:
    RELEASE_TAG: ${{ github.event.release.tag_name }}

    # A pre-release goes out under the dist-tag next, so `npm install @apple-protocols/devices` keeps the stable version.
    DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        name: 🚀 Publish to Registry
        steps:
            -   name: 👀 Checkout
                uses: actions/checkout@v6

            -   name: 🍞 Setup Bun
                uses: oven-sh/setup-bun@v2

            -   uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    registry-url: 'https://registry.npmjs.org'

            # Trusted publishing (OIDC) needs npm 11.5.1 or newer; npm 12 drops support for some Node versions.
            -   name: 📦️ Update npm
                run: npm install --global npm@^11.5.1

            # The tag may start with a v; the package version never does.
            -   name: ✏️ Version ${{ env.RELEASE_TAG }}
                run: |
                    version="${RELEASE_TAG#v}"
                    echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
                    sed -i "s/\"0\.0\.0\"/\"$version\"/g" packages/*/package.json
                    sed -i "s/workspace:\*/$version/g" packages/*/package.json

            -   name: 📦️ Install dependencies
                run: bun install --frozen-lockfile

            -   name: 🔨 Build
                run: |
                    bun --cwd packages/core build
                    bun --cwd packages/airplay build
                    bun --cwd packages/companion-link build
                    bun --cwd packages/audio-source build
                    bun --cwd packages/devices build

            # No NPM_TOKEN: npm authenticates through the trusted publisher configured per package on npmjs.com.
            -   name: 🚀 Publish ${{ env.RELEASE_VERSION }} as ${{ env.DIST_TAG }}
                run: |
                    for package in core airplay companion-link audio-source devices; do
                        (cd "packages/$package" && npm publish --provenance --access public --tag "$DIST_TAG")
                    done

            -   name: 📚 Build the docs
                run: bun --cwd docs build

            # A pre-release uploads a version of the docs without sending traffic to it; the live site stays on the last release.
            -   name: 🚀 Publish the docs (pre-release)
                uses: cloudflare/wrangler-action@v3
                if: ${{ github.event.release.prerelease }}
                with:
                    accountId: 5e565cf9fa55b0eae1f8131903da2ca9
                    apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    command: versions upload --tag prerelease-${{ env.RELEASE_VERSION }}
                    gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                    wranglerVersion: '4.141.0'

            -   name: 🚀 Publish the docs
                uses: cloudflare/wrangler-action@v3
                if: ${{ !github.event.release.prerelease }}
                with:
                    accountId: 5e565cf9fa55b0eae1f8131903da2ca9
                    apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                    wranglerVersion: '4.141.0'
