name: 🚀 Release packages

on:
    release:
        types: [ released ]

env:
    RELEASE_VERSION: ${{ github.event.release.tag_name }}

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        name: 🚀 Publish to Registry
        steps:
            -   name: 👀 Checkout
                uses: actions/checkout@v6

            -   name: 🍞 Setup Bun
                uses: oven-sh/setup-bun@v2

            -   uses: actions/setup-node@v6
                with:
                    node-version: '25'
                    registry-url: 'https://registry.npmjs.org'

            # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
            -   name: 📦️ Update npm
                run: npm install --global npm@latest

            -   name: ✏️ Tag v${{ env.RELEASE_VERSION }}
                run: |
                    sed -i 's/0.0.0/${{ env.RELEASE_VERSION }}/g' packages/*/package.json
                    sed -i 's/workspace:\*/${{ env.RELEASE_VERSION }}/g' packages/*/package.json

            -   name: 📦️ Install dependencies
                run: bun install --frozen-lockfile

            -   name: 🔨 Build
                run: |
                    bun --cwd packages/core build
                    bun --cwd packages/airplay build
                    bun --cwd packages/companion-link build
                    bun --cwd packages/audio-source build
                    bun --cwd packages/devices build

            # No NPM_TOKEN: npm authenticates through the trusted publisher configured per package on npmjs.com.
            -   name: 🚀 Publish v${{ env.RELEASE_VERSION }}
                run: |
                    (cd packages/core && npm publish --provenance --access public)
                    (cd packages/airplay && npm publish --provenance --access public)
                    (cd packages/companion-link && npm publish --provenance --access public)
                    (cd packages/audio-source && npm publish --provenance --access public)
                    (cd packages/devices && npm publish --provenance --access public)
